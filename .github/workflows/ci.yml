# Continuous integration and deployment. See docs/DEPLOYMENT.md.
#
# check:  every push and pull request; typecheck, lint, format check, unit tests, production build, Playwright E2E.
# deploy: pushes to main only, after check, and only when the CLOUDFLARE_API_TOKEN secret exists.
#         Applies D1 migrations first, then deploys. Without the secret the job is skipped and
#         releases happen by hand: `npm run db:migrate:prod && npm run deploy`.
#         The token needs D1 Edit and R2 Edit as well as Workers Scripts Edit (docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets cannot be read in a job-level `if`, so the check happens in a step.
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping deploy (see docs/DEPLOYMENT.md)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: env.HAS_TOKEN == 'true'
      # VITE_ variables are inlined into the bundle HERE, at build time. A
      # wrangler `var` cannot deliver one, so the Stytch public token has to be
      # in this step's environment or the deployed bundle carries `undefined`
      # and the sign-in screen silently fails to initialise (ADR-31). Set it as
      # a repository VARIABLE (not a secret - it ships in the bundle either way).
      # Leaving it unset is correct while Stytch is not in use.
      - run: npm run build
        if: env.HAS_TOKEN == 'true'
        env:
          VITE_STYTCH_PUBLIC_TOKEN: ${{ vars.VITE_STYTCH_PUBLIC_TOKEN }}
      # Migrations run BEFORE the deploy, and must stay backward compatible with
      # the Worker version still serving traffic while this step runs.
      - name: Apply D1 migrations
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply STUDIO_DB --remote
      - name: Deploy to Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
